name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ACTOR_NAME: "Luciano Britis"
      GIT_AUTHOR_NAME: "Luciano Britis"
      GIT_AUTHOR_EMAIL: "lucianobritis@gmail.com"
      GIT_COMMITTER_NAME: "Luciano Britis"
      GIT_COMMITTER_EMAIL: "lucianobritis@gmail.com"
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git Actor Identity
      run: |
        git config --global user.name "Luciano Britis"
        git config --global user.email "lucianobritis@gmail.com"
        echo "Pipeline desencadeada por: Luciano Britis (${{ github.actor }})"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.5.x"
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install Dependencies
      run: |
        make setup
        
    - name: Run Ruff Linter
      run: |
        make lint
        
    - name: Run Pytest
      run: |
        make test

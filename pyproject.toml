[project]
name = "mlops-architecture-showcase"
version = "1.0.0"
description = "Institutional-Grade MLOps & Quantitative Trading Engine Showcase"
authors = [
    {name = "Luciano Britis", email = "lucianobritis@hotmail.com"}
]
keywords = [
    "quant-finance",
    "mlops",
    "high-frequency-trading",
    "hft",
    "polars",
    "pytorch",
    "reinforcement-learning",
    "lakehouse",
    "algorithmic-trading",
    "b3-futures"
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.40.0",
    "prefect>=3.8.0",
    "numpy>=2.0.0",
    "pandas>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/LucianoBritis/mlops-architecture-showcase"
Documentation = "https://github.com/LucianoBritis/mlops-architecture-showcase/tree/main/docs"
Repository = "https://github.com/LucianoBritis/mlops-architecture-showcase.git"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlops-architecture-showcase"
version = "1.0.0"
description = "Institutional-Grade MLOps Trading Engine Showcase"
authors = [
    {name = "Luciano Britis", email = "luciano@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20.0",
    "prefect>=2.14.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0", # Used only for legacy connector compatibility
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
